<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mcp-devtools · inspector</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0a0a0a;
        --panel: #111;
        --border: #1f1f1f;
        --fg: #e6e6e6;
        --muted: #8a8a8a;
        --accent: #6ee7b7;
        --warn: #fbbf24;
        --error: #f87171;
        font-family: ui-monospace, "JetBrains Mono", SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--fg); height: 100vh; display: grid; grid-template-rows: 48px 1fr; }
      header {
        display: flex; align-items: center; gap: 12px;
        padding: 0 16px; border-bottom: 1px solid var(--border);
        font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase;
      }
      header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
      header .spacer { flex: 1; }
      header .stat { color: var(--muted); font-size: 11px; }
      main { display: grid; grid-template-columns: 360px 1fr; min-height: 0; }
      .timeline { border-right: 1px solid var(--border); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
      .filter-bar {
        display: flex; align-items: center; gap: 8px;
        padding: 8px 12px; border-bottom: 1px solid var(--border);
        background: #0e0e0e;
      }
      .filter-bar input {
        flex: 1; background: #060606; color: var(--fg);
        border: 1px solid var(--border); border-radius: 4px;
        padding: 6px 10px; font-family: inherit; font-size: 12px;
      }
      .filter-bar input:focus { outline: none; border-color: var(--accent); }
      .filter-bar .count { color: var(--muted); font-size: 11px; white-space: nowrap; }
      .filter-bar select {
        background: #060606; color: var(--fg);
        border: 1px solid var(--border); border-radius: 4px;
        padding: 5px 8px; font-family: inherit; font-size: 12px;
        cursor: pointer;
      }
      .filter-bar select:focus { outline: none; border-color: var(--accent); }
      .rows { flex: 1; overflow-y: auto; }
      .row {
        padding: 10px 14px; border-bottom: 1px solid var(--border);
        cursor: pointer; font-size: 12px; position: relative;
        border-left: 3px solid transparent;
      }
      .row:hover { background: #161616; }
      .row.selected { background: #1c1c1c; }
      /* Classification tints — subtle left border + tiny bg tint */
      .row.req      { border-left-color: var(--warn);   background-color: rgba(251, 191, 36, 0.04); }
      .row.resp-ok  { border-left-color: var(--accent); background-color: rgba(110, 231, 183, 0.04); }
      .row.resp-err { border-left-color: var(--error);  background-color: rgba(248, 113, 113, 0.08); }
      .row.notif    { border-left-color: var(--muted);  background-color: rgba(138, 138, 138, 0.03); }
      .row.selected.req      { background: #261d10; }
      .row.selected.resp-ok  { background: #102621; }
      .row.selected.resp-err { background: #2a1414; }
      .row.selected.notif    { background: #1c1c1c; }
      .row .dir { display: inline-block; width: 24px; color: var(--muted); }
      .row.out .dir { color: var(--warn); }
      .row.in  .dir { color: var(--accent); }
      .row.in.resp-err .dir { color: var(--error); }
      .row .method { font-weight: 600; }
      .row .lat { float: right; color: var(--muted); }
      .row .cost {
        float: right; margin-right: 8px;
        color: var(--accent); font-size: 11px; opacity: 0.85;
        font-variant-numeric: tabular-nums;
      }
      .row .cost.unknown { color: var(--muted); opacity: 0.6; }
      .row .server-badge {
        display: inline-block; margin-left: 6px;
        padding: 1px 6px; border-radius: 3px;
        font-size: 10px; font-weight: 500; letter-spacing: 0.03em;
        opacity: 0.85; vertical-align: middle;
      }
      .row.hidden { display: none; }
      header .total {
        color: var(--accent); font-size: 11px;
        font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
      }
      header .total.zero { color: var(--muted); opacity: 0.5; }
      .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); background: var(--panel); }
      .tab {
        padding: 10px 20px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase;
        cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted);
      }
      .tab:hover { color: var(--fg); }
      .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
      .panel { display: none; }
      .panel.active { display: flex; flex-direction: column; min-height: 0; flex: 1; }
      .topo-wrap { flex: 1; overflow: hidden; position: relative; }
      .topo-tooltip {
        position: absolute; background: #1a1a1a; border: 1px solid var(--border);
        border-radius: 4px; padding: 8px 12px; font-size: 11px; pointer-events: none;
        display: none; max-width: 240px; z-index: 10;
      }
      .detail { padding: 0; overflow: auto; display: flex; flex-direction: column; min-height: 0; }
      .detail-bar {
        display: flex; align-items: center; gap: 8px;
        padding: 10px 22px; border-bottom: 1px solid var(--border);
        background: #0e0e0e;
      }
      .detail-bar .label { color: var(--muted); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; flex: 1; }
      .detail-bar button {
        background: #1a1a1a; color: var(--fg); border: 1px solid var(--border);
        border-radius: 4px; padding: 6px 12px; font: inherit; font-size: 11px; cursor: pointer;
      }
      .detail-bar button:hover { background: #222; border-color: var(--accent); }
      .detail-bar button.flash { background: var(--accent); color: #000; border-color: var(--accent); }
      .detail-body { padding: 18px 22px; overflow: auto; flex: 1; }
      pre { background: #060606; border: 1px solid var(--border); padding: 14px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 0; }
      .empty { color: var(--muted); padding: 24px; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <span class="dot"></span>
      <span>mcp-devtools · inspector</span>
      <span class="spacer"></span>
      <span class="total zero" id="stat-cost" title="Sum of cost estimates across all tools/call responses in this session">$0.0000</span>
      <span class="stat" id="stat-frames">0 frames</span>
    </header>
    <main style="display:flex;flex-direction:column;min-height:0">
      <div class="tabs">
        <div class="tab active" data-tab="timeline">Timeline</div>
        <div class="tab" data-tab="topology">Topology</div>
      </div>
      <!-- Timeline panel -->
      <div id="panel-timeline" class="panel active" style="display:flex;flex:1;min-height:0">
        <div class="timeline">
          <div class="filter-bar">
            <input id="filter" type="search" placeholder="Filter by method or body — Esc to clear" autocomplete="off" spellcheck="false" />
            <select id="server-filter"><option value="">All servers</option></select>
            <span class="count" id="filter-count"></span>
          </div>
          <div class="rows" id="rows"></div>
        </div>
        <div class="detail" id="detail">
          <div class="empty">Select a frame to inspect.</div>
        </div>
      </div>
      <!-- Topology panel -->
      <div id="panel-topology" class="panel" style="flex:1;min-height:0">
        <div class="topo-wrap" id="topo-wrap">
          <div class="empty" id="topo-empty">Waiting for multi-server frames…</div>
        </div>
        <div class="topo-tooltip" id="topo-tooltip"></div>
      </div>
    </main>
    <script>
      // Minimal inspector — v0.1.x. The React UI replaces this once the
      // schema explorer and replay views are ready (v0.2).
      const rowsEl   = document.getElementById("rows");
      const detail   = document.getElementById("detail");
      const stat     = document.getElementById("stat-frames");
      const statCost = document.getElementById("stat-cost");
      const filter   = document.getElementById("filter");
      const fcount   = document.getElementById("filter-count");
      const topoWrap    = document.getElementById("topo-wrap");
      const topoTooltip = document.getElementById("topo-tooltip");
      let activeTab = "timeline";

      // Tab switching
      for (const tab of document.querySelectorAll(".tab")) {
        tab.addEventListener("click", () => {
          activeTab = tab.dataset.tab;
          for (const t of document.querySelectorAll(".tab"))   t.classList.toggle("active", t.dataset.tab === activeTab);
          for (const p of document.querySelectorAll(".panel")) p.classList.toggle("active", p.id === `panel-${activeTab}`);
          if (activeTab === "topology") renderTopology();
        });
      }

      function switchToTimeline(server) {
        activeTab = "timeline";
        for (const t of document.querySelectorAll(".tab"))   t.classList.toggle("active", t.dataset.tab === "timeline");
        for (const p of document.querySelectorAll(".panel")) p.classList.toggle("active", p.id === "panel-timeline");
        if (server !== undefined) {
          serverFilterEl.value = server;
          serverFilterStr = server;
          render();
        }
      }

      function renderTopology() {
        const callsByServer = {};
        for (const f of frames) {
          if (!f.server) continue;
          if (!callsByServer[f.server]) callsByServer[f.server] = [];
          const c = classify(f);
          if (c.kind === "request") callsByServer[f.server].push(f);
        }
        const serverNames = Object.keys(callsByServer);

        if (serverNames.length === 0) {
          topoWrap.innerHTML = '<div class="empty">Waiting for multi-server frames…</div>';
          return;
        }

        const W = topoWrap.clientWidth  || 800;
        const H = topoWrap.clientHeight || 500;
        const cx = W / 2;
        const cy = H / 2;
        const radius = Math.min(W, H) * 0.35;
        const count = serverNames.length;

        const svgParts = [`<svg width="${W}" height="${H}" xmlns="http://www.w3.org/2000/svg">`];

        serverNames.forEach((name, i) => {
          const angle = (2 * Math.PI * i / count) - Math.PI / 2;
          const nx = cx + radius * Math.cos(angle);
          const ny = cy + radius * Math.sin(angle);
          const weight = Math.min(6, 1 + (callsByServer[name].length / 5));
          const color = serverColor(name);
          svgParts.push(`<line x1="${cx}" y1="${cy}" x2="${nx}" y2="${ny}" stroke="${color}" stroke-width="${weight.toFixed(1)}" opacity="0.35"/>`);
        });

        svgParts.push(`<circle cx="${cx}" cy="${cy}" r="22" fill="#1a1a1a" stroke="#555" stroke-width="1.5"/>`);
        svgParts.push(`<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="#8a8a8a" font-size="10" font-family="monospace">agent</text>`);

        serverNames.forEach((name, i) => {
          const angle = (2 * Math.PI * i / count) - Math.PI / 2;
          const nx = cx + radius * Math.cos(angle);
          const ny = cy + radius * Math.sin(angle);
          const calls = callsByServer[name].length;
          const r = Math.min(44, 20 + calls * 1.5);
          const color = serverColor(name);
          svgParts.push(`<circle cx="${nx}" cy="${ny}" r="${r}" fill="#111" stroke="${color}" stroke-width="1.5" data-server="${escapeHtml(name)}" style="cursor:pointer"/>`);
          svgParts.push(`<text x="${nx}" y="${ny + 4}" text-anchor="middle" fill="${color}" font-size="11" font-family="monospace" pointer-events="none">${escapeHtml(name)}</text>`);
          svgParts.push(`<text x="${nx}" y="${ny + 17}" text-anchor="middle" fill="${color}" opacity="0.65" font-size="10" font-family="monospace" pointer-events="none">${calls} call${calls === 1 ? "" : "s"}</text>`);
        });

        svgParts.push("</svg>");
        topoWrap.innerHTML = svgParts.join("");

        for (const circle of topoWrap.querySelectorAll("circle[data-server]")) {
          const server = circle.getAttribute("data-server");
          circle.addEventListener("mouseenter", (ev) => {
            const recent = (callsByServer[server] || []).slice(-3).reverse();
            if (!recent.length) return;
            topoTooltip.innerHTML = recent.map((f) => {
              const c = classify(f);
              return `<div style="margin-bottom:4px"><span style="color:${serverColor(server)}">${escapeHtml(c.method ?? "?")}</span></div>`;
            }).join("");
            topoTooltip.style.display = "block";
            topoTooltip.style.left = `${ev.offsetX + 12}px`;
            topoTooltip.style.top  = `${ev.offsetY + 8}px`;
          });
          circle.addEventListener("mousemove", (ev) => {
            topoTooltip.style.left = `${ev.offsetX + 12}px`;
            topoTooltip.style.top  = `${ev.offsetY + 8}px`;
          });
          circle.addEventListener("mouseleave", () => {
            topoTooltip.style.display = "none";
          });
          circle.addEventListener("click", () => {
            switchToTimeline(server);
          });
        }
      }

      const serverFilterEl = document.getElementById("server-filter");

      const frames = [];
      let selected = null;
      let filterStr = "";
      let serverFilterStr = "";
      const knownServers = new Set();

      function updateServerFilter() {
        const current = serverFilterEl.value;
        let changed = false;
        for (const f of frames) {
          if (f.server && !knownServers.has(f.server)) {
            knownServers.add(f.server);
            const opt = document.createElement("option");
            opt.value = f.server;
            opt.textContent = f.server;
            serverFilterEl.appendChild(opt);
            changed = true;
          }
        }
        if (changed) serverFilterEl.value = current;
      }

      const SERVER_PALETTE = [
        '#6ee7b7','#fbbf24','#f87171','#818cf8',
        '#34d399','#fb923c','#60a5fa','#c084fc',
      ];

      function serverColor(name) {
        if (!name) return '#8a8a8a';
        let h = 0;
        for (let i = 0; i < name.length; i++) h = (Math.imul(31, h) + name.charCodeAt(i)) | 0;
        return SERVER_PALETTE[Math.abs(h) % SERVER_PALETTE.length];
      }

      function serverBadgeHtml(f) {
        if (!f.server) return '';
        const color = serverColor(f.server);
        return `<span class="server-badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${escapeHtml(f.server)}</span>`;
      }

      function fmtCost(usd) {
        if (usd === null || usd === undefined) return null;
        if (usd >= 0.01) return `$${usd.toFixed(4)}`;
        if (usd >= 0.0001) return `$${usd.toFixed(5)}`;
        return `$${usd.toExponential(2)}`;
      }

      function costBadgeHtml(f) {
        if (!f.cost) return "";
        if (f.cost.usd == null) {
          return `<span class="cost unknown" title="No price for the configured model — pass --model and --pricing-file to enable cost attribution">—</span>`;
        }
        const tip =
          f.cost.basis === "local-seconds"
            ? `local model · billed by wall-clock seconds`
            : `${f.cost.inputTokens ?? 0}→${f.cost.outputTokens ?? 0} tokens (chars/4 estimate)`;
        return `<span class="cost" title="${escapeHtml(tip)}">${fmtCost(f.cost.usd)}</span>`;
      }

      function updateTotalCost() {
        let total = 0;
        let anyKnown = false;
        for (const f of frames) {
          if (f.cost && f.cost.usd != null) {
            total += f.cost.usd;
            anyKnown = true;
          }
        }
        statCost.textContent = anyKnown ? `$${total.toFixed(4)}` : "$0.0000";
        statCost.classList.toggle("zero", !anyKnown);
      }

      function classify(f) {
        if (f.frame._parseError) return { kind: "malformed" };
        const fr = f.frame;
        if (fr.id != null && fr.method) return { kind: "request", method: fr.method, id: fr.id };
        if (fr.id != null) return { kind: "response", id: fr.id, isError: !!fr.error };
        if (fr.method) return { kind: "notification", method: fr.method };
        return { kind: "malformed" };
      }

      function rowClass(f) {
        const c = classify(f);
        const cls = ["row", f.direction];
        if (c.kind === "request")       cls.push("req");
        else if (c.kind === "response") cls.push(c.isError ? "resp-err" : "resp-ok");
        else if (c.kind === "notification") cls.push("notif");
        return cls;
      }

      function rowLabel(f) {
        const c = classify(f);
        if (c.kind === "request") return c.method;
        if (c.kind === "response") return c.isError ? `← #${c.id} · error` : `← #${c.id}`;
        if (c.kind === "notification") return c.method;
        return "(malformed)";
      }

      function matchesFilter(f) {
        if (serverFilterStr && f.server !== serverFilterStr) return false;
        if (!filterStr) return true;
        const c = classify(f);
        const hay = [
          c.method ?? "",
          String(c.id ?? ""),
          JSON.stringify(f.frame),
        ].join(" ").toLowerCase();
        return hay.includes(filterStr);
      }

      function render() {
        updateServerFilter();
        let shown = 0;
        rowsEl.innerHTML = frames.map((f, i) => {
          const visible = matchesFilter(f);
          if (visible) shown++;
          const cls = rowClass(f);
          if (i === selected) cls.push("selected");
          if (!visible) cls.push("hidden");
          return `<div class="${cls.join(" ")}" data-i="${i}">
            <span class="dir">${f.direction === "in" ? "←" : "→"}</span>
            <span class="method">${escapeHtml(rowLabel(f))}</span>
            ${serverBadgeHtml(f)}
            ${costBadgeHtml(f)}
          </div>`;
        }).join("");
        stat.textContent = `${frames.length} frame${frames.length === 1 ? "" : "s"}`;
        updateTotalCost();
        fcount.textContent = filterStr ? `${shown}/${frames.length}` : "";
        for (const el of rowsEl.children) {
          el.addEventListener("click", () => {
            selected = Number(el.dataset.i);
            render();
            showDetail(frames[selected]);
          });
        }
      }

      function showDetail(f) {
        const json = JSON.stringify(f.frame, null, 2);
        detail.innerHTML = `
          <div class="detail-bar">
            <span class="label">${escapeHtml(f.direction === "in" ? "server → client" : "client → server")}</span>
            <button id="copy-btn" title="Copy this frame as JSON">Copy as JSON</button>
          </div>
          <div class="detail-body"><pre>${escapeHtml(json)}</pre></div>
        `;
        const btn = document.getElementById("copy-btn");
        btn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(json);
            const original = btn.textContent;
            btn.textContent = "Copied ✓";
            btn.classList.add("flash");
            setTimeout(() => {
              btn.textContent = original;
              btn.classList.remove("flash");
            }, 1200);
          } catch (err) {
            btn.textContent = "Clipboard blocked";
            setTimeout(() => (btn.textContent = "Copy as JSON"), 1500);
          }
        });
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
      }

      // Filter input — debounced lightly so typing isn't laggy on big sessions.
      let filterTimer;
      filter.addEventListener("input", (e) => {
        clearTimeout(filterTimer);
        filterTimer = setTimeout(() => {
          filterStr = e.target.value.trim().toLowerCase();
          render();
        }, 80);
      });
      filter.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          filter.value = "";
          filterStr = "";
          render();
        }
      });
      serverFilterEl.addEventListener("change", () => {
        serverFilterStr = serverFilterEl.value;
        render();
      });

      const ws = new WebSocket(`ws://${location.host}/ws`);
      ws.onmessage = (ev) => {
        const msg = JSON.parse(ev.data);
        if (msg.type === "frame") {
          frames.push(...msg.frames);
          render();
          if (activeTab === "topology") renderTopology();
        }
      };

      fetch("/api/frames?since=0").then(r => r.json()).then(initial => {
        frames.push(...initial);
        render();
      });
    </script>
  </body>
</html>
